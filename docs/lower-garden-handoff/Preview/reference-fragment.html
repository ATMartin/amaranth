#amaranth-lower-garden-approved .am-meeting:not(.am-selected){background:color-mix(in srgb,var(--am-bg) 92%,transparent)}
#amaranth-lower-garden-approved .am-meeting.am-selected{background:var(--am-soft)}
#amaranth-lower-garden-approved .am-list-label{color:var(--am-ink)}
#amaranth-lower-garden-approved .am-meeting.am-selected>span{color:light-dark(#6D5C64,#B9C3B5)}
#amaranth-lower-garden-approved .am-library-foot{background:var(--am-bg);margin-left:-12px;margin-right:-12px;margin-bottom:-24px;padding:18px 19px 24px}
@media(max-width:850px){#amaranth-lower-garden-approved .am-circle .am-layout{grid-template-columns:190px minmax(0,1fr)}}
@media(max-width:560px){#amaranth-lower-garden-approved .am-circle .am-layout{display:block}#amaranth-lower-garden-approved .am-library{min-height:350px}#amaranth-lower-garden-approved .am-library-foot{display:none}#amaranth-lower-garden-approved .am-watermark-layer{mask-image:linear-gradient(180deg,transparent 10%,#000 60%,#000 100%)}#amaranth-lower-garden-approved .am-watermark-art{right:0;bottom:-170px}}
@media(prefers-contrast:more){#amaranth-lower-garden-approved .am-watermark-layer{opacity:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('amaranth-lower-garden-approved');
 const products=[...root.querySelectorAll('.am-product')];
 const sample={ '12:18':{person:'Maya',quote:'Could we keep setup to three steps? I can explore a shorter version, then we can see what’s missing.'},'13:03':{person:'Alex',quote:'Do we need the microphone choice here, or can that stay in recording settings? Let’s leave that open for now.'},'14:06':{person:'Sam',quote:'I’ll bring a rough welcome screen to Friday’s review. We can decide what to keep then.'}};
 const clone=id=>root.querySelector('#'+id).content.cloneNode(true);
 let initializing=true;const key=p=>p.dataset.study||p.dataset.palette||p.dataset.design;const states={};let saved={};
 function persist(){if(initializing)return;window.openai?.setWidgetState?.({modelContent:{exploration:'Approved Lower Garden watermark',watermarks:Object.fromEntries(Object.entries(states).map(([id,v])=>[id,{appearance:v.theme,strength:v.watermarkStrength??(id==='garden'?12:14),scale:v.watermarkWidth??(id==='garden'?390:510),enabled:v.watermarkEnabled??true}]))},privateContent:states}).catch(()=>{});}
 function setTheme(p,theme){p.style.colorScheme=theme==='system'?'light dark':theme;const image=p.closest('[data-variant]').querySelector('.am-proof-icon');if(image){image.src=theme==='light'?image.dataset.iconLight:image.dataset.iconDark;image.alt='Inner Circle '+theme+' app icon';}const button=p.querySelector('[data-action="theme"]');button.textContent=theme==='system'?'Appearance':theme==='dark'?'Dark':'Light';button.setAttribute('aria-label','Appearance: '+theme+'. Change appearance');}
 function current(p){return states[key(p)];}
 function show(p,view){let doc=p.querySelector('.am-document');doc.replaceChildren(clone('am-'+view+'-template'));doc.dataset.content=view;p.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('am-active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});current(p).view=view;doc.querySelectorAll('textarea').forEach(t=>{t.value=current(p)[t.getAttribute('aria-label')]??t.value;t.addEventListener('input',()=>{current(p)[t.getAttribute('aria-label')]=t.value;persist()})});persist();}
 function pane(p,kind='ask',time){let el=p.querySelector('.am-sidepane');el.hidden=false;p.classList.add('am-pane-open');el.replaceChildren();if(kind==='ask'){el.append(clone('am-ask-template'));if(p.dataset.design==='circle')p.classList.remove('am-pane-open');}else{let h=document.createElement('div');h.className='am-pane-top';h.innerHTML='<span class="am-section-label">FROM THE CONVERSATION</span><button type="button" class="cursor-interaction" data-action="close-pane" aria-label="Close evidence">×</button>';let quote=document.createElement('p');quote.className='am-evidence-quote';quote.textContent='“'+sample[time].quote+'”';let who=document.createElement('div');who.className='am-evidence-person';who.textContent=sample[time].person+' · '+time;let b=document.createElement('button');b.type='button';b.className='am-source cursor-interaction';b.dataset.seek=time;b.textContent='Play from '+time+' ↗';el.append(h,quote,who,b);}current(p).pane=kind;persist();}
 function closePane(p){p.querySelector('.am-sidepane').hidden=true;p.classList.remove('am-pane-open');current(p).pane=null;persist();}
 function seek(p,time){p.querySelector('.am-current').textContent=time;let parts=time.split(':').map(Number);p.querySelector('.am-player input').value=parts[0]*60+parts[1];p.querySelectorAll('[data-time]').forEach(el=>el.classList.toggle('am-highlight',el.dataset.time===time));current(p).time=time;p.querySelector('.am-status').textContent='Recording positioned at '+time;persist();}
 function evidence(p,time){if(!sample[time])return;if(p.dataset.design==='notebook'){pane(p,'evidence',time);}else if(p.dataset.design==='circle'){show(p,'transcript');seek(p,time);}else{if(current(p).view!=='notes')show(p,'notes');let el=p.querySelector('.am-inline-evidence');el.hidden=false;el.replaceChildren();let heading=document.createElement('div');heading.className='am-section-label';heading.textContent=sample[time].person+' · '+time;let quote=document.createElement('p');quote.textContent='“'+sample[time].quote+'”';let b=document.createElement('button');b.type='button';b.className='am-source cursor-interaction';b.dataset.seek=time;b.textContent='Play from '+time+' ↗';el.append(heading,quote,b);}current(p).source=time;persist();}
 function answer(p,text){if(p.querySelector('.am-sidepane').hidden||current(p).pane!=='ask')pane(p);let el=p.querySelector('.am-answer');el.hidden=false;el.querySelector('.am-question-echo').textContent=text||'What are the next steps?';current(p).question=text||'What are the next steps?';persist();}
 function modal(p,type){let overlay=p.querySelector('.am-overlay');overlay.hidden=false;overlay.replaceChildren();if(type==='setup')overlay.append(clone('am-setup-template'));else{let dialog=document.createElement('div');dialog.className='am-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');let title=document.createElement('h3'),body=document.createElement('p');const info={share:['Share a copy','Choose an export format. Your original recording remains on this Mac.'],people:['People in this meeting','Maya · Sam · Alex · Unknown speaker'],calendar:['Link a calendar event','Product check-in · Today at 9:30 AM'],identify:['Identify this speaker','Choose a name for the unidentified voice.'],delete:['Delete this audio?','The transcript and notes can be kept separately.']};title.textContent=info[type][0];dialog.setAttribute('aria-label',info[type][0]);body.textContent=info[type][1];dialog.append(title,body);if(type==='share'){let select=document.createElement('select');select.setAttribute('aria-label','Export format');['Notes as Markdown','Transcript as text','Audio file'].forEach(v=>{let o=document.createElement('option');o.textContent=v;select.append(o)});dialog.append(select);}if(type==='people'||type==='identify'){let input=document.createElement('input');input.setAttribute('aria-label','Speaker name');input.placeholder='Speaker name';dialog.append(input);}let actions=document.createElement('div');actions.className='am-dialog-actions';let close=document.createElement('button');close.type='button';close.dataset.action='dismiss';close.textContent=type==='delete'?'Keep audio':'Done';close.className='cursor-interaction';actions.append(close);dialog.append(actions);overlay.append(dialog);}p.querySelector('.am-chrome').inert=true;p.querySelector('.am-layout').inert=true;overlay.querySelector('input,button,select')?.focus();}
 function dismiss(p){p.querySelector('.am-overlay').hidden=true;p.querySelector('.am-chrome').inert=false;p.querySelector('.am-layout').inert=false;p.querySelector('[data-action="setup"]').focus();}
 for(const p of products){const id=key(p);states[id]={view:'transcript',theme:'dark',pane:'ask',...saved[id]};p.querySelector('.am-player-slot').append(clone('am-player-template'));show(p,current(p).view);if(current(p).meeting)p.querySelector('.am-title').textContent=current(p).meeting;setTheme(p,current(p).theme);if(p.dataset.design==='circle'||current(p).pane==='ask')pane(p);if(current(p).time)seek(p,current(p).time);if(current(p).question)answer(p,current(p).question);
 p.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){show(p,b.dataset.view);return;}if(b.dataset.source){evidence(p,b.dataset.source);return;}if(b.dataset.seek){seek(p,b.dataset.seek);return;}if(b.dataset.meeting){p.querySelectorAll('.am-meeting').forEach(x=>x.classList.toggle('am-selected',x===b));p.querySelector('.am-title').textContent=b.dataset.meeting;current(p).meeting=b.dataset.meeting;persist();return;}const action=b.dataset.action;if(action==='theme'){let themes=['light','dark'];current(p).theme=themes[(themes.indexOf(current(p).theme)+1)%themes.length];setTheme(p,current(p).theme);persist();}if(action==='ask')pane(p);if(action==='close-pane')closePane(p);if(action==='library'){let lib=p.querySelector('.am-library');lib.hidden=!lib.hidden;}if(['setup','share','people','calendar','identify','delete'].includes(action)){if(action==='setup'&&current(p).recording){current(p).recording=false;b.innerHTML='<span aria-hidden="true">●</span> Record';p.querySelector('.am-status').textContent='Recording stopped in design preview';persist();}else modal(p,action);}if(action==='dismiss')dismiss(p);if(action==='start'){let name=p.querySelector('[name="meeting-title"]').value.trim();if(name)p.querySelector('.am-title').textContent=name;dismiss(p);current(p).recording=true;p.querySelector('[data-action="setup"]').innerHTML='<span aria-hidden="true">■</span> Stop · 00:00';p.querySelector('.am-status').textContent='Recording state preview';persist();}if(action==='play'){current(p).playing=!current(p).playing;b.textContent=current(p).playing?'Ⅱ':'▶';b.setAttribute('aria-label',current(p).playing?'Pause recording':'Play recording');persist();}if(action==='speed'){let speeds=['1×','1.25×','1.5×','2×'];b.textContent=speeds[(speeds.indexOf(b.textContent)+1)%speeds.length];current(p).speed=b.textContent;persist();}if(action==='suggestion')answer(p,'What are the next steps?');});
 p.addEventListener('submit',e=>{e.preventDefault();let input=e.target.querySelector('input');answer(p,input.value.trim()||'What are the next steps?');input.value='';});
 p.addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.querySelector('.am-overlay').hidden)dismiss(p);if(e.key==='Tab'&&!p.querySelector('.am-overlay').hidden){const focusable=[...p.querySelector('.am-overlay').querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus()}}});
 p.addEventListener('input',e=>{if(e.target.matches('.am-search input')){let q=e.target.value.toLowerCase();p.querySelectorAll('.am-meeting').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));}if(e.target.matches('.am-transcript-heading input')){let q=e.target.value.toLowerCase();p.querySelectorAll('.am-transcript-row').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));}if(e.target.matches('.am-player input')){let n=+e.target.value;seek(p,Math.floor(n/60)+':'+String(n%60).padStart(2,'0'));}});

 if(globalThis.Tweak){let s={appearance:current(p).theme,reading:14};let tweak=new Tweak({container:p,onChange:()=>{current(p).theme=s.appearance;setTheme(p,s.appearance);p.style.setProperty('--am-reading',s.reading+'px');persist();}});tweak.addSelect(s,'appearance',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});tweak.addSlider(s,'reading',{label:'Reading size',min:13,max:17,step:1,unit:'px'});}
 }
 initializing=false;
 window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent;if(!incoming)return;for(const p of products){let s=incoming[key(p)];if(!s)continue;states[key(p)]={...current(p),...s};setTheme(p,current(p).theme);if(s.view&&p.querySelector('.am-document').dataset.content!==s.view){initializing=true;show(p,s.view);initializing=false;}}});
})();
</script>
